schema_version: 1

context:
  name: langchain-anthropic
  version: 1.7.8

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/${{ name[0] }}/${{ name }}/langchain_anthropic-${{ version }}.tar.gz
  sha256: 9b90bef16adacaf4c41bea0f561d9be164f618a7c7d6a5c0832ae2758be075bb

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - pydantic >=2.7.4
    - python >=${{ python_min }},<4.0
    - langchain-core >=1.7.3,<2.0.0
    - anthropic >=0.120.0
tests:
  - python:
      imports:
        - langchain_anthropic
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: An integration package connecting AnthropicMessages and LangChain
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/langchain-ai/langchain

extra:
  recipe-maintainers:
    - ccurme
    - mdrxy
    - jan-janssen
